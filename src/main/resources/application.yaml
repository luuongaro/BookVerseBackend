spring:
  application:
    name: BookVerse

  config:
    import: optional:file:.env

  datasource:
    url: ${BOOKS_VERSE_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

google:
  books:
    api:
      url: ${GOOGLE_BOOKS_API_URL}
      key: ${GOOGLE_BOOKS_API_KEY}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  password-reset:
    expiration-minutes: 30
    cooldown-seconds: 120
  admin:
    username: ${ADMIN_USERNAME}
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}

  mail:
    provider: ${MAIL_PROVIDER:smtp}
    resend-api-key: ${RESEND_API_KEY:}
    from: ${MAIL_FROM}

mercado-pago:
  access-token: ${MERCADO_PAGO_ACCESS_TOKEN}
  webhook-secret: ${MERCADO_PAGO_WEBHOOK_SECRET}

bookverse:
  premium:
    price: ${BOOKVERSE_PREMIUM_PRICE}
    back-url: ${BOOKVERSE_PREMIUM_BACK_URL}
    test-payer-email: ${MERCADO_PAGO_TEST_PAYER_EMAIL:}